sources:
  平均泌乳量:
    filename: milk_yield.xlsx
    url: https://lin.alic.go.jp/alic/statis/dome/data2/j_excel/5030a.xlsx
    sheet: 5030_１頭１日あたり平均泌乳量
    skip_rows: 10
    date_column: 0
    items:
      milk_yield_hokkaido:
        category: milk
        data_column: 1
        unit: kg/日/頭
        label: 北海道平均泌乳量
        description: 北海道の1日あたり平均泌乳量
      milk_yield_honshu:
        category: milk
        data_column: 3
        unit: kg/日/頭
        label: 本州平均泌乳量
        description: 本州の1日あたり平均泌乳量

  生乳農家販売価格:
    filename: milk_price.xlsx
    url: https://lin.alic.go.jp/alic/statis/dome/data2/j_excel/5051A.xlsx
    sheet: 5051_生乳農家販売価格
    skip_rows: 6
    date_column: 0
    items:
      milk_price:
        data_column: 1
        category: milk
        unit: 円/kg
        label: 生乳価格
        description: 生乳農家販売価格

