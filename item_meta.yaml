        data_column: 26
        unit: 千円/頭
        label: ホルオス
        description: ホルスタイン種オスの平均価格
      cross_female:
        category: calf
        data_column: 34
        unit: 千円/頭
        label: 交雑メス
        description: 交雑種メスの平均価格
      cross_male:
        category: calf
        data_column: 35
        unit: 千円/頭
        label: 交雑オス
        description: 交雑種オスの平均価格

