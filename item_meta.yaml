  子牛の取引頭数と価格:
    filename: calf_price.xlsx
    url: https://lin.alic.go.jp/alic/statis/dome/data2/j_excel/2140a.xlsx
    sheet: 2140_肉用子牛の取引頭数と価格
    skip_rows: 15
    date_column: 0
    items:
      wagyu_female:
        category: calf
        data_column: 4
        unit: 千円/頭
        label: 和牛メス
        description: 黒毛和種メスの平均価格
      wagyu_male:
        category: calf
        data_column: 5
        unit: 千円/頭
        label: 和牛オス
        description: 黒毛和種オスの平均価格
      holstein_female:
